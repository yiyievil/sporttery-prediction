name: sporttery-cloud

# 云端无人值守竞彩预测
# - 定时: 每天北京时间 09:30 自动预测当日全部开盘场次 (cron 为 UTC)
# - 手动: GitHub 网页/手机 App → Actions → 本工作流 → Run workflow, 可选模式/日期/场次

on:
  schedule:
    - cron: "30 1 * * *" # 每天 09:30 北京时间: 预测当日全部开盘场次
    - cron: "0 0 * * *"  # 每天 08:00 北京时间: 验证昨日赛果+结算模拟投注
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        required: true
        default: "predict"
        type: choice
        options: [predict, update, verify]
      date:
        description: "日期 (260811 或 2026-08-11, 留空=predict/update今日, verify昨日)"
        required: false
        default: ""
      numbers:
        description: "场次编号 (如 001,002, 留空=当日全部)"
        required: false
        default: ""

permissions:
  contents: write # 允许把预测结果回传仓库

concurrency:
  group: sporttery-cloud
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Shanghai
      SPORTTERY_WORKSPACE: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖 (Python + Node + 中文字体)
        run: |
          pip install requests reportlab
          npm ci
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-wqy-microhei

      - name: 执行预测流水线
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # 定时触发: 按 cron 来源区分 (github.event.schedule)
            if [ "${{ github.event.schedule }}" = "30 1 * * *" ]; then
              python cloud_daily.py --mode predict
            else
              python cloud_daily.py --mode verify
            fi
          else
            python cloud_daily.py \
              --mode "${{ github.event.inputs.mode || 'predict' }}" \
              --date "${{ github.event.inputs.date }}" \
              --numbers "${{ github.event.inputs.numbers }}"
          fi

      - name: 结果回传仓库 (predictions/ + 报告PDF)
        run: |
          git config user.name "sporttery-cloud-bot"
          git config user.email "bot@users.noreply.github.com"
          git add predictions/ *.pdf 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无新产物, 跳过提交"
          else
            git commit -m "chore(cloud): daily run $(TZ=Asia/Shanghai date +%F)"
            git pull --rebase origin master || true
            git push
          fi

      - name: 上传产物备份 (Actions Artifacts, 保留30天)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prediction-${{ github.run_id }}
          path: |
            predictions/*.json
            predictions/*.pdf
            *.pdf
          retention-days: 30
